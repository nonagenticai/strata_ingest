# One Rust toolchain for this repo, everywhere: the same release CI installs
# (`.github/workflows/ci.yml` `rust_toolchain`) and the image builds with
# (`Dockerfile` `ARG RUST_TOOLCHAIN`). Pin it locally too, so every host and
# every worktree compiles the release the service ships on.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
